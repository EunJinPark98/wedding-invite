name: Keep Supabase Alive

# 매주 월요일 00:00 UTC에 실행 (주 1회)
on:
  schedule:
    - cron: '0 0 * * 1'
  # 수동 트리거도 가능 (Actions 탭에서 버튼 클릭)
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent auto-pause
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/invitations?select=slug&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
          echo "Supabase keep-alive ping sent ✓"
